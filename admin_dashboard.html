<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-commerce Dashboard</title>
    <link
      rel="stylesheet"
      href="./assets/fontawesome-free-6.6.0-web/css/all.min.css"
    />
    <link rel="stylesheet" href="./public/css/admin_dashboard.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="logo"><i class="fas fa-store"></i> ShopAdmin</div>
      <nav>
        <ul>
          <li>
            <a href="#" class="active"
              ><i class="fas fa-tachometer-alt"></i> Dashboard</a
            >
          </li>
          <li>
            <a href="#"><i class="fas fa-box"></i> Orders</a>
          </li>
          <li>
            <a href="#"><i class="fas fa-cubes"></i> Products</a>
          </li>
          <li>
            <a href="#"><i class="fas fa-tags"></i> Categories</a>
          </li>
          <li>
            <a href="#"><i class="fas fa-envelope"></i> Inbox</a>
          </li>
        </ul>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <header>
        <div class="header-left">
          <h1>Dashboard</h1>
          <p>Your overview of the e-commerce platform</p>
        </div>
        <div class="header-right"><i class="fas fa-user-circle"></i> Admin</div>
      </header>

      <!-- Analytics Section -->
      <section class="analytics">
        <div class="overview">
          <h3>Overview</h3>
          <div class="stats">
            <div class="stat-item">
              <h4><i class="fas fa-box"></i> Total Orders</h4>
              <p>1,234</p>
            </div>
            <div class="stat-item">
              <h4><i class="fas fa-dollar-sign"></i> Revenue</h4>
              <p>$45,678</p>
            </div>
            <div class="stat-item">
              <h4><i class="fas fa-cube"></i> Products</h4>
              <p>320</p>
            </div>
          </div>
        </div>
        <section class="analytics">
          <div class="chart">
            <h3>Sales Analytics</h3>
            <img
              src="./assets/images/hd.jpeg"
              alt="Sales Analytics Chart"
              style="width: 100%; border-radius: 10px"
            />
          </div>
        </section>
      </section>
    </div>
  </body>
</html>
